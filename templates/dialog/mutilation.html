<div class="dialog mutilation-localisation">
  <p class="hint">
    Mutilation (livret p.30) : cliquez une zone sur le schéma (ou le bouton correspondant), ou tirez une
    Blatte au sort pour la déterminer.
  </p>

  <div class="loc-image-wrap">
    <img src="systems/insectopia/assets/localisation-insecte.png" alt="Schéma de localisation" />
    <svg class="loc-overlay" viewBox="0 0 490 486" preserveAspectRatio="none">
      <rect class="loc-hotspot" data-zone="tete" x="220" y="0" width="80" height="67"><title>Tête</title></rect>
      <rect class="loc-hotspot" data-zone="aile" x="60" y="67" width="160" height="106"><title>Aile (gauche)</title></rect>
      <rect class="loc-hotspot" data-zone="thorax" x="160" y="67" width="200" height="106"><title>Thorax</title></rect>
      <rect class="loc-hotspot" data-zone="aile" x="300" y="67" width="160" height="106"><title>Aile (droite)</title></rect>
      <rect class="loc-hotspot" data-zone="abdomen" x="200" y="173" width="120" height="107"><title>Abdomen</title></rect>
      <rect class="loc-hotspot" data-zone="patte" x="200" y="280" width="120" height="45"><title>Pattes</title></rect>
    </svg>
  </div>

  <div class="loc-buttons">
    <button type="button" class="loc-zone-btn" data-zone="tete">Tête — mort</button>
    <button type="button" class="loc-zone-btn" data-zone="thorax">Thorax — immobilisation</button>
    <button type="button" class="loc-zone-btn" data-zone="abdomen">Abdomen — mort</button>
    <button type="button" class="loc-zone-btn" data-zone="aile">Aile — mutilation</button>
    <button type="button" class="loc-zone-btn" data-zone="patte">Patte — mutilation</button>
  </div>

  <div class="loc-hasard">
    <button type="button" class="loc-tirage-btn">
      <i class="fas fa-dice"></i> Tirer une Blatte au sort (Rouge=Tête, Verte=Thorax, Noire=Abdomen, Bleue=Aile, Blanche=Patte)
    </button>
  </div>

  <style>
    .mutilation-localisation .hint { font-style: italic; margin-bottom: 6px; }

    /* Grille 1x1 : l'image et le SVG occupent exactement la même cellule,
       donc le même rectangle à l'écran, quelle que soit la taille réelle
       du dialogue. Le SVG utilise un viewBox calé sur les pixels natifs
       de localisation-insecte.png (490x486) : chaque <rect> est donc
       toujours aligné avec le dessin, sans dépendre d'un calcul de % sur
       un conteneur "auto" (source du bug précédent). */
    .mutilation-localisation .loc-image-wrap {
      display: grid;
      width: 260px;
      margin: 0 auto 10px auto;
    }
    .mutilation-localisation .loc-image-wrap img,
    .mutilation-localisation .loc-image-wrap svg {
      grid-area: 1 / 1;
      width: 100%;
      height: 100%;
      display: block;
    }
    .mutilation-localisation .loc-image-wrap img { border-radius: 4px; }
    .mutilation-localisation .loc-hotspot {
      fill: rgba(180, 0, 0, 0);
      stroke: none;
      cursor: pointer;
      transition: fill 0.1s ease;
    }
    .mutilation-localisation .loc-hotspot:hover { fill: rgba(180, 0, 0, 0.35); }

    .mutilation-localisation .loc-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
      margin-bottom: 8px;
    }
    .mutilation-localisation .loc-buttons button { flex: 1 1 45%; }
    .mutilation-localisation .loc-hasard { text-align: center; }
  </style>
</div>
